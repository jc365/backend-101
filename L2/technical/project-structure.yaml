        - "precalculate-availability.js"
        - "purge-cache.js"
      - "__tests__/"
        - "unit/"
        - "integration/"
        - "utils/"
        - "services/"
        - "e2e/"
        - "setup.js"
      - "server.js"
      - "app.js"
      - "socket.js"  # WebSocket server for real-time logs
  
  frontend:
    - "src/"
      - "assets/"
      - "components/"
        - "public/BookingWizard/"
        - "tenant/Dashboard/"
        - "tenant/Management/"
        - "tenant/Agenda/"
        - "admin/"
        - "shared/"
        - "layout/"
      - "contexts/"
        - "AppStateContext.jsx"
        - "AuthContext.jsx"
        - "ReservationContext.jsx"
        - "CalendarContext.jsx"
        - "ConfigContext.jsx"
        - "LogContext.jsx"
      - "hooks/"
        - "useAuth.js"
        - "useLogger.js"
        - "useConfig.js"
        - "useTimezone.js"
        - "useWebSocket.js"
        - "useErrorHandler.js"
        - "useReservation.js"
      - "services/"
        - "api.js"
        - "authService.js"
        - "reservationService.js"
        - "logService.js"
        - "websocketService.js"
        - "tenantService.js"
      - "utils/"
        - "dateUtils.js"
        - "timezoneUtils.js"
        - "validationUtils.js"
        - "constants.js"
      - "pages/"
        - "Public/"
          - "BookingPage.jsx"
          - "ServiceSelection.jsx"
          - "Confirmation.jsx"
        - "Tenant/"
          - "Dashboard.jsx"
          - "Employees.jsx"
          - "Services.jsx"
          - "Calendar.jsx"
          - "Clients.jsx"
          - "Settings.jsx"
        - "Admin/"
          - "Tenants.jsx"
          - "LogsViewer.jsx"
          - "Config.jsx"
        - "Auth/"
          - "Login.jsx"
          - "Register.jsx"
          - "ForgotPassword.jsx"
      - "App.jsx"
      - "main.jsx"
      - "routes.jsx"
  
  shared:
    - ".env.example"
    - ".env.local"  # Git ignored
    - ".env.production"
    - "docker-compose.yml"
    - "docker-compose.dev.yml"
    - "Dockerfile.backend"
    - "Dockerfile.frontend"
    - "nginx.conf"
    - "package.json"  # Backend
    - "package.json"  # Frontend (in frontend/)
    - "README.md"
    - "LICENSE"

  configuration_system:
    location: "src/core/config/"
    purpose: "Sistema centralizado de gestión de configuración"
    key_files:
      - "index.js: Clase ConfigManager principal"
      - "loaders/envLoader.js: Carga desde .env y variables"
      - "loaders/dbLoader.js: Carga desde DB (hot reload)"
      - "schemas/configSchema.js: Validación de configuración"
      - "middleware/configMiddleware.js: Middleware HTTP"
    
    integration:
      database: "src/config/database.js usa ConfigManager"
      app: "app.js inyecta req.config en todas las rutas"
      frontend: "/api/config/public endpoint para configuración segura"
    
    conventions:
      - "Nuevo código en src/core/ usa ES Modules"
      - "Configuración se obtiene via config.get() no process.env"
      - "Cambios en caliente vía base de datos"